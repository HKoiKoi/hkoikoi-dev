name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR은 새 push가 오면 이전 실행을 취소한다. main은 취소하지 않는다: 연속 push로 deploy가 배포
# 도중(링크 교체·재시작)에 취소되면 안 되기 때문이다. main에서 대기 중인 실행은 최신 하나만 남는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com

  # 권한 회귀 smoke. 시크릿 없이 placeholder 환경변수만 쓰며, 관리자 계정·DB 쓰기·
  # 이미지 업로드가 없는 access-control 스펙만 돌려 데이터 오염(blog-images 고아 파일)이 없다.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
      - run: npx playwright test e2e/access-control.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  # 홈 서버(Mac mini)의 self-hosted runner에서 실행하는 운영 배포. 저장소가 public이므로
  # push to main에서만 이 runner를 쓰고, pull_request(포크 포함)에서는 절대 실행하지 않는다.
  # 서버에서 shared/.env.local로 직접 빌드하므로 GitHub Secrets는 쓰지 않는다.
  deploy:
    needs: [check, e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, macOS, homeserver]
    timeout-minutes: 20
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 배포
        run: bash deploy/deploy.sh "$GITHUB_SHA"
